<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do List</title>

    <!-- Bootstrap 5 CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">My To-Do List</a>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#"></a></li>
                    <li class="nav-item"><a class="nav-link" href="#"></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <!-- Page Heading -->
                        <h1 class="text-center mb-4">Task Manager</h1>

                        <!-- Task Input + Add Task Button -->
                        <!-- Task Input + Add Task Button -->
                        <div class="input-group mb-1">
                            <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task...">
                            <button class="btn btn-primary" id="addTaskBtn" type="button">Add Task</button>
                        </div>

                        <!-- Error message (hidden until needed) -->
                        <div id="errorMessage" class="text-danger small mb-3 d-none">
                            Please enter a task. It cannot be empty or contain only spaces.
                        </div>

                        <!-- Filter Buttons -->
                        <div class="btn-group w-100 mb-3" role="group" aria-label="Task filters">
                            <button type="button" class="btn btn-outline-secondary active" id="filterAll">All</button>
                            <button type="button" class="btn btn-outline-secondary" id="filterActive">Active</button>
                            <button type="button" class="btn btn-outline-secondary"
                                id="filterCompleted">Completed</button>
                        </div>

                        <!-- Task List -->
                        <ul class="list-group mb-3" id="taskList"></ul>

                        <!-- Task Counter + Clear Completed Button -->
                        <div class="d-flex justify-content-between align-items-center">
                            <span id="taskCounter"></span>
                            <button class="btn btn-danger btn-sm" id="clearCompletedBtn" type="button">Clear
                                Completed</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>

</html>
